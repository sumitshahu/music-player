<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a0707">
<title>भक्ति संगीत · Devotional Player</title>
<link rel="preconnect" href="https://drive.usercontent.google.com" crossorigin>
<link rel="preconnect" href="https://drive.google.com" crossorigin>
<script>
  // ============ SETUP ============
  // Google Drive API key. Makes Drive streaming reliable (see steps). Leave "" to try plain Drive links.
  const API_KEY = "";
  // ===============================
  const driveUrls = id => {
    const e = encodeURIComponent(id), u = [];
    if (API_KEY) u.push("https://www.googleapis.com/drive/v3/files/" + e + "?alt=media&key=" + API_KEY);
    u.push("https://drive.usercontent.google.com/download?id=" + e + "&export=download&confirm=t");
    u.push("https://drive.google.com/uc?export=download&id=" + e);
    return u;
  };
  // GitHub "blob" links are web pages, not audio. Convert them to the real file (Pages URL first, raw as backup).
  const fileUrls = u => {
    const g = u.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/(?:blob|raw)\/([^/]+)\/([^?#]+)/);
    if (g) return ["https://" + g[1] + ".github.io/" + g[2] + "/" + g[4], "https://raw.githubusercontent.com/" + g[1] + "/" + g[2] + "/" + g[3] + "/" + g[4]];
    return [new URL(u, location.href).href];
  };
  // Turns QR text (Drive link/ID, ?src=file, or an audio file/URL) into {key, urls[], drive}
  function resolve(t) {
    t = (t || "").trim();
    const n = t.match(/(?:^|[?&])(?:s|id)=(\d{1,4})(?:[&#]|$)/) || t.match(/^(\d{1,4})$/);
    if (n) return { key: "s" + +n[1], shlok: String(+n[1]) };
    let m = t.match(/[?&]src=([^&#]+)/);
    if (m) { const u = decodeURIComponent(m[1]); return { key: u, urls: fileUrls(u) }; }
    m = t.match(/\/d\/([\w-]+)/) || t.match(/[?&]id=([\w-]+)/) || (/^[\w-]{25,}$/.test(t) ? [0, t] : null);
    if (m) return { key: m[1], urls: driveUrls(m[1]), drive: true };
    if (/\.(mp3|m4a|aac|wav|ogg|opus|flac)(\?.*)?$/i.test(t)) return { key: t, urls: fileUrls(t) };
    return null;
  }
  const A = new Audio(); A.preload = "auto";
  // Opened from a QR link: start fetching the audio immediately
  const FIRST = location.search ? resolve(location.search) : null;
  if (FIRST && FIRST.urls) { A.src = FIRST.urls[0]; A.play().catch(() => {}); }
  // Song list: fetched at once; edits to page.json show up on the next load
  let ORDER = [];
  const DATA_P = fetch("page.json", { cache: "no-cache" }).then(r => r.json())
    .then(d => { ORDER = Object.keys(d).sort((a, b) => a - b); return d; }).catch(() => null);
  // QR decoder: jsQR.js sits next to this page (fast, same host); the CDN is only a backup.
  const loadScript = (src, ms = 7000) => new Promise((ok, no) => {
    const s = document.createElement("script"), t = setTimeout(() => no(new Error("timeout")), ms);
    s.onload = () => { clearTimeout(t); ok(); };
    s.onerror = () => { clearTimeout(t); no(new Error("load")); };
    s.src = src; document.head.appendChild(s);
  });
  const DECODER = (async () => {
    if (window.jsQR) return true;
    for (const u of ["jsQR.js", "https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"]) {
      try { await loadScript(u); if (window.jsQR) return true; } catch (e) {}
    }
    return false;
  })();
</script>
<style>
  :root { --gold:#f5c451; --gold2:#ffe3a3; --ink:#fff4dc; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100dvh; color:var(--ink); overflow-x:hidden;
    font-family:"Noto Serif Devanagari","Kohinoor Devanagari","Nirmala UI","Mangal",Georgia,serif;
    background:radial-gradient(120% 80% at 50% 108%,#c2570a 0%,#7a1d0a 35%,#3a0a08 65%,#1d0404 100%); }
  #bg { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  #mandala { position:absolute; left:50%; top:46%; width:min(150vmin,1000px); aspect-ratio:1; opacity:.3;
    transform:translate(-50%,-50%); animation:spin 240s linear infinite; will-change:transform; }
  #mandala svg { width:100%; height:100%; }
  @keyframes spin { from{transform:translate(-50%,-50%) rotate(0)} to{transform:translate(-50%,-50%) rotate(360deg)} }
  .ember { position:absolute; bottom:-12px; border-radius:50%; opacity:0; will-change:transform;
    background:radial-gradient(circle,#ffd27a,#ff8a1f 60%,transparent 70%); animation:rise linear infinite; }
  @keyframes rise { 0%{transform:translateY(0);opacity:0} 15%{opacity:.9} 100%{transform:translateY(-105vh) translateX(var(--dx));opacity:0} }
  main { position:relative; max-width:440px; min-height:100dvh; margin:0 auto; padding:max(22px,env(safe-area-inset-top)) 20px 28px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; }
  .om { font-size:3.2rem; line-height:1; color:var(--gold); text-shadow:0 0 24px rgba(255,160,40,.85); animation:glow 4s ease-in-out infinite; }
  @keyframes glow { 50%{text-shadow:0 0 38px rgba(255,190,70,1)} }
  h1 { font-size:1.5rem; color:var(--gold2); text-shadow:0 0 18px rgba(255,170,60,.55); }
  #lyrics { position:relative; width:100%; max-height:8.8em; overflow-y:auto; scrollbar-width:none; font-size:1rem; line-height:1.7; color:rgba(255,233,189,.5);
    -webkit-mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent); mask-image:linear-gradient(transparent,#000 16%,#000 84%,transparent); }
  #lyrics::-webkit-scrollbar { display:none; }
  #lyrics p { margin:.15em 0; padding:.1em 6px; cursor:pointer; transition:color .4s,font-size .3s,text-shadow .4s; }
  #lyrics p.on, #lyrics.plain p { color:var(--gold2); }
  #lyrics p.on { font-size:1.18em; text-shadow:0 0 14px rgba(255,170,60,.7); }
  #frame { position:relative; width:min(76vw,290px); aspect-ratio:1; border-radius:24px; overflow:hidden; border:3px solid var(--gold);
    box-shadow:0 0 0 6px rgba(245,196,81,.15),0 0 42px rgba(255,150,40,.45),inset 0 0 30px rgba(0,0,0,.5);
    background:radial-gradient(circle,#6a1a0a,#2a0707); }
  #cam { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  #idle { position:absolute; inset:0; background:radial-gradient(circle,#6a1a0a,#2a0707); display:grid; place-items:center; font-size:6rem; color:var(--gold); text-shadow:0 0 30px rgba(255,150,40,.9); }
  #idle img { width:100%; height:100%; object-fit:cover; }
  .scanning::after { content:""; position:absolute; left:8%; right:8%; height:2px; top:12%;
    background:linear-gradient(90deg,transparent,var(--gold),transparent); animation:sweep 2.2s ease-in-out infinite; }
  @keyframes sweep { 50%{top:88%} }
  #status { min-height:1.5em; font-size:.95rem; color:#ffd9a0; }
  .dbg { min-height:1em; font-size:.72rem; color:#c9965a; }
  #scrub { display:flex; align-items:center; gap:10px; width:100%; font-size:.82rem; color:#ffd9a0; font-variant-numeric:tabular-nums; }
  #scrub span { min-width:2.6em; }
  #seek { -webkit-appearance:none; appearance:none; flex:1; height:34px; margin:0; background:transparent; cursor:pointer; touch-action:pan-y; --p:0%; }
  #seek::-webkit-slider-runnable-track { height:6px; border-radius:3px; background:linear-gradient(90deg,var(--gold) var(--p),rgba(255,227,163,.25) var(--p)); }
  #seek::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; margin-top:-8px; border-radius:50%; border:2px solid #8a4b0b;
    background:radial-gradient(circle at 35% 30%,#fff3cf,#f5b93d); box-shadow:0 0 12px rgba(255,170,60,.85); }
  #seek::-moz-range-track { height:6px; border-radius:3px; background:rgba(255,227,163,.25); }
  #seek::-moz-range-progress { height:6px; border-radius:3px; background:var(--gold); }
  #seek::-moz-range-thumb { width:20px; height:20px; border-radius:50%; border:2px solid #8a4b0b; background:#f5b93d; box-shadow:0 0 12px rgba(255,170,60,.85); }
  #seek:disabled { opacity:.45; cursor:default; }
  .row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .btn { font:inherit; font-size:1.05rem; font-weight:700; padding:13px 30px; border:0; border-radius:999px; cursor:pointer;
    color:#3a0a08; background:linear-gradient(180deg,#ffe3a3,#f5b93d); box-shadow:0 6px 22px rgba(255,150,40,.4); }
  .btn.ghost { background:transparent; color:var(--gold2); border:1.5px solid var(--gold); box-shadow:none; }
  .btn.round { width:52px; height:52px; padding:0; border-radius:50%; font-size:1.25rem; }
  .btn.big { width:68px; height:68px; font-size:1.6rem; }
  #ctrl { display:flex; gap:18px; align-items:center; }
  .hide { display:none !important; }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; } }
</style>
</head>
<body>
<div id="bg"><div id="mandala"></div></div>
<main>
  <div class="om">ॐ</div>
  <h1 id="title">॥ श्री गणेशाय नमः ॥</h1>
  <div id="lyrics" class="hide"></div>
  <div id="frame">
    <video id="cam" muted playsinline></video>
    <div id="idle">ॐ</div>
  </div>
  <p id="status"></p>
  <p id="dbg" class="dbg"></p>
  <div id="scrub" class="hide">
    <span id="tcur">0:00</span>
    <input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek" disabled>
    <span id="tdur">--:--</span>
  </div>
  <div id="ctrl" class="hide">
    <button class="btn ghost round" id="prev" aria-label="Previous">⏮</button>
    <button class="btn round big" id="pp" aria-label="Play or pause">▶</button>
    <button class="btn ghost round" id="next" aria-label="Next">⏭</button>
  </div>
  <button class="btn" id="scan">स्कैन करें · Scan</button>
</main>
<script>
  const $ = id => document.getElementById(id);
  const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
  const st = $("status"), pp = $("pp"), scanBtn = $("scan"), vid = $("cam"), frame = $("frame");
  const say = t => { st.textContent = t; };

  // ---------- Devotional background: lotus mandala + rising embers ----------
  (function () {
    let g = "";
    [[12,310,26,58],[18,240,18,44],[24,175,13,32],[36,115,8,22]].forEach(([n, r, rx, ry]) => {
      for (let i = 0; i < n; i++) g += `<ellipse cx="0" cy="${-r}" rx="${rx}" ry="${ry}" transform="rotate(${i * 360 / n})"/>`;
    });
    g += '<circle r="360"/><circle r="374"/><circle r="70"/>';
    $("mandala").innerHTML = `<svg viewBox="-400 -400 800 800" fill="rgba(245,196,81,.06)" stroke="#f5c451" stroke-width="1.6">${g}</svg>`;
    const bg = $("bg");
    for (let i = 0; i < 14; i++) {
      const d = document.createElement("i"), s = 3 + Math.random() * 5;
      d.className = "ember";
      d.style.cssText = `left:${Math.random() * 100}%;width:${s}px;height:${s}px;--dx:${(Math.random() * 80 - 40) | 0}px;animation-duration:${9 + Math.random() * 10}s;animation-delay:${-Math.random() * 14}s`;
      bg.appendChild(d);
    }
  })();

  // ---------- Audio ----------
  let lastKey = null, cur = null, tried = 0;
  const silent = () => A.src.startsWith("data:");
  const TITLE0 = $("title").textContent;
  let artTok = 0, lTok = 0, L = [], li = -1;
  const counter = () => cur && cur.shlok ? "🪔 " + (ORDER.indexOf(cur.shlok) + 1) + " / " + ORDER.length : "";
  function showCtrl() {
    $("ctrl").classList.remove("hide"); $("scrub").classList.remove("hide");
    const nav = cur && cur.shlok ? "visible" : "hidden";
    $("prev").style.visibility = $("next").style.visibility = nav; paintSeek();
  }
  function setArt(u) {                      // image goes where the camera view is
    const idle = $("idle"), k = ++artTok; idle.textContent = "ॐ";
    if (!u) return;
    const im = new Image(); im.alt = "";
    im.onload = () => { if (k === artTok) { idle.textContent = ""; idle.appendChild(im); } };
    im.src = u;
  }
  function parseLrc(txt) {
    let out = [], timed = false;
    txt.replace(/^\uFEFF/, "").split(/\r?\n/).forEach(line => {
      const tags = [...line.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)], t = line.replace(/\[[^\]]*\]/g, "").trim();
      if (!t) return;
      if (tags.length) { timed = true; tags.forEach(m => out.push({ s: +m[1] * 60 + +m[2], t })); }
      else if (!/^\[/.test(line.trim())) out.push({ s: null, t });
    });
    if (timed) out = out.filter(l => l.s != null).sort((a, b) => a.s - b.s);
    return out;
  }
  async function loadLyrics(u) {
    const k = ++lTok, box = $("lyrics"); L = []; li = -1; box.innerHTML = ""; box.className = "hide";
    if (!u) return;
    try { const r = await fetch(u); if (!r.ok) return; const l = parseLrc(await r.text()); if (k !== lTok) return; L = l; } catch (e) { return; }
    if (!L.length) return;
    L.forEach(l => { const p = document.createElement("p"); p.textContent = l.t; p.onclick = () => { if (l.s != null && isFinite(A.duration)) A.currentTime = l.s; }; box.appendChild(p); });
    box.className = L[0].s == null ? "plain" : ""; syncLyrics(true);
  }
  function syncLyrics(force) {
    if (!L.length || L[0].s == null) return;
    const t = A.currentTime + 0.15; let i = -1;
    for (let k = 0; k < L.length && L[k].s <= t; k++) i = k;
    if (i === li && !force) return; li = i;
    const box = $("lyrics"), ps = box.children;
    for (let k = 0; k < ps.length; k++) ps[k].classList.toggle("on", k === i);
    const el = ps[Math.max(i, 0)];
    if (el) box.scrollTo({ top: el.offsetTop - box.clientHeight / 2 + el.clientHeight / 2, behavior: "smooth" });
  }
  function showSong(it) {                   // title, picture, lyrics, lock-screen info
    $("title").textContent = it ? it.title : TITLE0;
    setArt(it && it.image); loadLyrics(it && it.lyrics);
    if (!scanning) $("dbg").textContent = counter();
    if ("mediaSession" in navigator) navigator.mediaSession.metadata = it ? new MediaMetadata({ title: it.title, artist: "भक्ति संगीत",
      artwork: it.image ? [{ src: new URL(it.image, location.href).href }] : [] }) : null;
  }
  const blocked = e => { if (e && e.name === "NotAllowedError") say("Tap ▶ to play"); };
  function begin(r, it) {
    cur = r; lastKey = r.key; tried = 0; showSong(it);
    A.loop = true;                          // always replay
    A.src = r.urls[0]; say("Loading…"); showCtrl();
    A.play().catch(blocked);
  }
  function play(r) { if (r.shlok) return playShlok(r.shlok); begin(r, null); }
  async function playShlok(n) {
    const d = await DATA_P, it = d && d[n];
    if (!it || !it.audio) { say("Shlok " + n + " isn't in page.json"); lastKey = null; return; }
    begin({ key: "s" + n, shlok: String(n), urls: fileUrls(it.audio) }, it);
  }
  const step = d => {
    if (!cur || !cur.shlok || !ORDER.length) return;
    playShlok(ORDER[(ORDER.indexOf(cur.shlok) + d + ORDER.length) % ORDER.length]);
  };
  $("next").onclick = () => step(1); $("prev").onclick = () => step(-1);
  if ("mediaSession" in navigator) [["play", () => A.play()], ["pause", () => A.pause()], ["nexttrack", () => step(1)], ["previoustrack", () => step(-1)]]
    .forEach(([a, f]) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} });
  async function diagnose(r) {
    say("Can't play this file…");
    try {
      const res = await fetch(r.urls[0], { headers: { Range: "bytes=0-0" } });
      if (res.status === 400) return say("Drive API key is invalid. Check API_KEY in index.html.");
      if (res.status === 403) return say("Drive refused (403). Share the file as “Anyone with the link” and check the key's website restriction.");
      if (res.status === 404) return say("File not found. Check the link and its sharing.");
      return say("Drive replied " + res.status + " but the browser can't play it. Is it an audio file?");
    } catch (e) {
      say(r.drive ? "Google blocks direct Drive playback without an API key. Add one in index.html (see setup steps)." : "Couldn't load that audio file. Check its path.");
    }
  }
  A.addEventListener("playing", () => { if (silent()) return; say("🪔 Playing"); pp.textContent = "❚❚"; pp.classList.remove("hide"); });
  A.addEventListener("pause", () => { if (!A.ended && !silent()) pp.textContent = "▶"; });
  A.addEventListener("waiting", () => { if (!silent()) say("Buffering…"); });
  A.addEventListener("ended", () => { if (silent()) return; lastKey = null; pp.textContent = "▶"; say("Finished · tap Scan for another"); });
  function onError() {
    if (silent() || !cur) return;
    if (tried < cur.urls.length - 1) { A.src = cur.urls[++tried]; A.play().catch(() => {}); return; }  // try the next source
    lastKey = null; diagnose(cur);
  }
  A.addEventListener("error", onError);
  pp.onclick = () => { A.paused ? A.play().catch(() => {}) : A.pause(); };

  // ---------- Scrubber (drag to jump forward or back) ----------
  const seek = $("seek"), tcur = $("tcur"), tdur = $("tdur");
  let dragging = false;
  const fmt = s => { if (!isFinite(s)) return "0:00"; s = Math.max(0, s | 0); return ((s / 60) | 0) + ":" + String(s % 60).padStart(2, "0"); };
  function paintSeek() {
    if (silent()) return;
    const d = A.duration, ok = isFinite(d) && d > 0;
    seek.disabled = !ok;
    if (!dragging) seek.value = ok ? (A.currentTime / d) * 1000 : 0;
    seek.style.setProperty("--p", (seek.value / 10) + "%");
    tcur.textContent = fmt(ok && dragging ? (seek.value / 1000) * d : A.currentTime);
    tdur.textContent = ok ? fmt(d) : "--:--";
    syncLyrics();
  }
  ["timeupdate", "durationchange", "loadedmetadata", "seeked", "emptied"].forEach(ev => A.addEventListener(ev, paintSeek));
  seek.addEventListener("pointerdown", () => { dragging = true; });
  seek.addEventListener("input", () => { dragging = true; paintSeek(); });
  const commitSeek = () => {
    const d = A.duration;
    if (isFinite(d) && d > 0) A.currentTime = (seek.value / 1000) * d;
    dragging = false; paintSeek();
  };
  seek.addEventListener("change", commitSeek);
  seek.addEventListener("pointerup", () => { if (dragging) commitSeek(); });
  seek.addEventListener("pointercancel", () => { dragging = false; paintSeek(); });

  // ---------- Scanner (jsQR runs the same on every browser) ----------
  let running = false, cv, cx, gotFrame = false, t0 = 0, camStream = null, wakeLock = null, scanning = false;
  const camError = e => ({
    NotAllowedError: "Camera permission denied. Allow camera for this site, then tap Start.",
    SecurityError: "Camera permission denied. Allow camera for this site, then tap Start.",
    NotFoundError: "No camera found on this device.",
    NotReadableError: "The camera is busy in another app. Close it and tap Start."
  })[e && e.name] || "Couldn't open the camera (" + ((e && e.name) || "unknown") + ").";

  const setScanBtn = on => { scanning = on; scanBtn.textContent = on ? "रोकें · Stop scan" : "स्कैन करें · Scan"; };
  async function startScanner() {
    if (!A.src) { A.loop = false; A.src = SILENT; }   // this tap unlocks audio for the whole session
    A.play().catch(() => {});
    setScanBtn(true);
    const fail = m => { stopScanner(); say(m); };
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
      return fail("This browser can't open the camera here. Open the page in Chrome or Safari over https.");
    say("Allow the camera when asked…");
    const warn = setTimeout(() => say("Waiting for camera permission… allow it, or enable Camera for this site in browser settings."), 7000);
    let stream;
    try {
      try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }); }
      catch (e) {
        if (e && (e.name === "OverconstrainedError" || e.name === "TypeError")) stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        else throw e;
      }
    } catch (e) { clearTimeout(warn); return fail(camError(e)); }
    clearTimeout(warn);
    if (!scanning) { stream.getTracks().forEach(t => t.stop()); return; }   // user tapped Stop while waiting
    camStream = stream; say("Starting camera…");
    vid.srcObject = stream; vid.play().catch(() => {});
    $("idle").classList.add("hide"); frame.classList.add("scanning");
    try { stream.getVideoTracks()[0].applyConstraints({ advanced: [{ focusMode: "continuous" }] }).catch(() => {}); } catch (e) {}
    try { navigator.wakeLock && navigator.wakeLock.request("screen").then(l => { wakeLock = l; }).catch(() => {}); } catch (e) {}
    if (!(await DECODER)) return fail("Scanner file missing. Upload jsQR.js next to index.html, then reload.");
    if (!scanning) return;
    cv = cv || document.createElement("canvas"); cx = cx || cv.getContext("2d", { willReadFrequently: true });
    running = true; gotFrame = false; t0 = Date.now();
    tick();
  }
  function stopScanner() {                  // camera off, picture back
    running = false; setScanBtn(false);
    if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
    vid.srcObject = null;
    try { wakeLock && wakeLock.release().catch(() => {}); } catch (e) {}
    wakeLock = null;
    frame.classList.remove("scanning"); $("idle").classList.remove("hide");
    $("dbg").textContent = counter();
  }
  function tick() {
    if (!running) return;
    if (vid.readyState >= 2 && vid.videoWidth) {
      if (!gotFrame) {
        gotFrame = true; $("dbg").textContent = "scanning · camera " + vid.videoWidth + "×" + vid.videoHeight;
        if (A.paused || !cur) say("Point the camera at a QR code");
      }
      const sc = Math.min(1, 720 / vid.videoWidth), w = (vid.videoWidth * sc) | 0, h = (vid.videoHeight * sc) | 0;
      if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
      cx.drawImage(vid, 0, 0, w, h);
      let c = null;
      try { c = jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: "dontInvert" }); } catch (e) {}
      if (c && c.data) onCode(c.data);
    } else if (!gotFrame && Date.now() - t0 > 6000) {
      say("Camera opened but shows no video. Reload, close other camera apps and try again.");
    }
    setTimeout(tick, 70);
  }
  function onCode(t) {
    const r = resolve(t);
    if (!r) { say("That QR isn't a music code"); return; }
    if (r.key !== lastKey) play(r);
    stopScanner();               // got a code: turn the camera off until the user taps Scan again
  }
  scanBtn.onclick = () => {
    if (!scanning) return startScanner();
    stopScanner();                          // user tapped Stop: picture back, status reset
    say(!cur ? "Tap Scan, then point at a QR code" : A.paused ? "Paused" : "🪔 Playing");
  };

  // ---------- Mode ----------
  if (FIRST && FIRST.shlok) playShlok(FIRST.shlok);      // opened from a QR by the phone's camera app
  else if (FIRST) { begin(FIRST, null); if (A.error) onError(); }
  else say("Tap Scan, then point at a QR code");
</script>
</body>
</html>
